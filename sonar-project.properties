sonar.projectKey=brew-cafe
sonar.projectName=Brew Cafe

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
